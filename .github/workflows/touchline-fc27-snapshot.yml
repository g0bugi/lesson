name: Build TOUCHLINE FC27 Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'touchline-data/build_fc27_snapshot.py'
      - '.github/workflows/touchline-fc27-snapshot.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified EA FC27 Big 5 snapshot
        run: python touchline-data/build_fc27_snapshot.py
      - name: Commit snapshot
        run: |
          git config user.name 'touchline-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add touchline-data/fc27-big5.json touchline-data/manifest.json
          if git diff --cached --quiet; then
            echo 'No snapshot changes'
          else
            git commit -m 'Update TOUCHLINE FC27 Big 5 snapshot'
            git push
          fi
